# ============================================================================
# dsh-auto-continue —— DSH bundle patch
# ============================================================================
# 这是插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件的 patch，
# 本文件把自动续写这一行插入 profile 的配置树。
#
# 行 id 是 `auto-continue`：设置页保存的配置会以同一个 id 写成一条
# 只有 `config:` 而没有 `insert:` 的覆盖行追加在 profile patch 里，两者靠
# 这个 id 对齐。改名会让已保存的设置静默失效。
#
# 想关掉它：在 profile 层加一条
#   - id: auto-continue
#     disabled: true
# ============================================================================

- insert:
    - id: auto-continue
      name: dsh-auto-continue
